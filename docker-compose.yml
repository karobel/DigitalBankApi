version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: digitalbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: digitalbank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - digitalbank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digitalbank-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=digitalbank;Username=postgres;Password=postgres"
      Jwt__Key: "local-dev-secret-key-change-me-before-prod-1234567890"
    ports:
      - "8080:8080"

volumes:
  digitalbank_pgdata:
